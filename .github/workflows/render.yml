# AO trailer render pipeline (Tidepool Alpha).
# Trailer: 15s @ 24fps = 360 frames (N in the shard job).
# Renders the trailer as up to 40 frame-slice shards in parallel, then stitches the chunks.

name: Render AO Trailer (Tidepool Alpha)

on:
  workflow_dispatch:
    inputs:
      shards: {description: 'Parallel render workers (max 40)', default: '40'}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          N=${{ inputs.shards }}; [ "$N" -gt 40 ] && N=40
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Render frame slice
        env:
          I: ${{ matrix.i }}
          K: ${{ inputs.shards }}
        run: |
          N=360
          RANGE=$(python3 -c "import os;n=$N;k=min(int(os.environ['K']),40);i=int(os.environ['I']);a=n*i//k;b=n*(i+1)//k-1;print(f'{a}-{b}')")
          echo "frames $RANGE of $N"
          npx remotion render src/index.ts Main "out/chunk_$(printf %02d $I).mp4" --frames="$RANGE" --gl=swangle --concurrency=$(nproc) --codec=h264 --crf=14 --pixel-format=yuv420p 2>&1 | tr '\r' '\n' | grep -vE '^\s*$' | tail -5
          ls -la out/chunk_*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: out/chunk_*.mp4
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  join:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: {pattern: chunk-*, path: chunks, merge-multiple: true}
      - name: Join chunks
        run: |
          ls chunks/*.mp4 | sort | sed "s|^|file '$PWD/|;s|$|'|" > list.txt
          ffmpeg -nostdin -v error -y -f concat -safe 0 -i list.txt -c copy out/ao_trailer_1080p.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,duration -of compact out/ao_trailer_1080p.mp4
      - uses: actions/upload-artifact@v4
        with: {name: ao-trailer, path: out/ao_trailer_1080p.mp4, compression-level: 0, retention-days: 30}
